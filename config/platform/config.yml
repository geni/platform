#############################################################################
# Platform Configuration
#
# Default settings for all environments
#
# You can overload any feature for any environment by changing the
# environment settings at the bottom of the file.
#
# Alternatively, you can overload any of the methods of Platform::Config
#############################################################################

defaults: &defaults
  enable_platform:              true
  enable_app_directory:         true
  enable_embedded_applications: true
  enable_mobile_applications:   true
  enable_developer_agreement:   true
  enable_developer_tabs:        true
  enable_app_statistics:        true
  enable_api_log:               true
  # The OAuth scope system.  Off means the developer screens hide the scope picker and
  # Platform::Application#registered_scopes returns [] whatever is granted, so no token is
  # narrowed.  Capability flags (allow_iframe, no_rate_limit, ...) are a separate mechanism and
  # are not affected by this.
  enable_scopes:                false

  #############################################################################
  # Platform best run with caching enabled
  # You can configure cache adapter and store parameters by providing the
  # the name of your class implementation and the store settings. For example:
  #
  #
  # cache_adapter:  ActiveSupport::Cache
  # cache_store:    memory_store
  # cache_store:    file_store
  # cache_store:    drb_store
  # cache_store:    [mem_cache_store, 'localhost:11211']
  #
  # Alternatively you can provide your own implementation of cache by setting
  # the adapter to your own class.
  #############################################################################
  caching:
    enabled:                  false
    adapter:                  "Tr8n::GeniCacheAdapter"
    version:                  1 # you can change the version to invalidate the cache

  #############################################################################
  # OAuth hardening switches.  See Platform::Config.oauth_enforce? for what each
  # check rejects once it is on, and why they all ship off.
  #
  # The host application can override any of these -- Geni routes them through
  # Registry.oauth so they can be flipped without a deploy.
  #############################################################################
  oauth:
    enforce:
      client_secret:            false
      client_secret_password:   false
      pkce:                     false
      redirect_uri:             false
      revocation_auth:          false
      scope:                    false
      xd_origin:                false

    # request and refresh tokens are always freshly minted and handed straight back to the
    # caller, so digesting them at rest costs nothing.  access and client tokens are not in this
    # list because Platform::Application#find_or_create_access_token *reuses* a stored access
    # token, which a digest cannot reproduce -- see OauthToken.store_digest?.
    hashed_token_types:
      - Platform::Oauth::RequestToken
      - Platform::Oauth::RefreshToken

    allow_cleartext_token_lookup: true

    refresh_token_lifetime:     7776000   # 90 days -- was unlimited
    request_token_lifetime:     600       # 10 minutes

    # How long after a refresh token is redeemed a second presentation of it is still answered with
    # the replacement it was exchanged for, rather than revoking the whole family.
    #
    # RFC 9700 section 4.14.2 asks for family revocation when a refresh token is replayed, and
    # leaves the detection window to the implementation; Okta's refresh token rotation ships the
    # same allowance as its grace period.  Without one, a client that never received our reply -- a
    # dropped connection, a killed process, a laptop asleep mid-request -- presents the only token
    # it still holds and is answered by revoking every token it owns, which is a full
    # re-authorization charged to an honest client for our lost response.  A client with several
    # processes behind one credential file hits the same thing routinely.
    #
    # 0 disables the window and restores strict one-presentation detection.
    refresh_token_grace_period: 60        # 1 minute

    # Device authorization grant, RFC 8628.  device_verification_uri is where the user is sent to
    # type the user_code; the host application decides the path and routes it at
    # Platform::OauthController#device, so it cannot be derived here.
    device_code_lifetime:       600       # 10 minutes
    device_poll_interval:       5         # seconds between polls, section 3.5
    device_code_attempts:       10        # user_code guesses per session before refusing
    # device_verification_uri:  "https://www.example.com/device"

  #############################################################################
  # By default, Platform will use its own logger. If you set it to false,
  # it will use default Rails logger.
  #############################################################################
  logger:
    enabled:                  true
    log_path:                 "log/platform.log"      # location of the log file

  #############################################################################
  # Site Integration Settings
  #############################################################################
  site_info:
    title:                    "Example"
    # The bare hostname of the site this gem is mounted in.  Read through
    # Platform::Config.site_host / .site_url, which replaced the SITE and DEFAULT_SITE_LINK
    # constants the gem used to interpolate without ever defining them.
    host:                     "www.example.com"
    contact_email:            "platform@example.com"
    default_url:              "/platform/home"
    login_url:                "/login"
    platform_layout:          "platform/platform"
    admin_layout:             "platform/platform_admin"
    oauth_layout:             "application"
    user_info:
      enabled:                true
      current_user_method:    "current_user"
      logout_method:          "logout!"
      class_name:             "::User"
      methods:
        id:                   "id"
        name:                 "name"
        email:                "email"
        link:                 "path"
        mugshot:              "mugshot"
        admin:                "admin?"
        guest:                "guest?"

  #############################################################################
  # API Settings
  #############################################################################
  API:
    enabled:                  true
    base_url:                 "localhost:3000/api/"
    logging_enabled:          true
    admin_email:              "api@example.com"
    # Anonymous API calls -- no access token, and no user picked up from the session either.
    # Off means Platform::Api::BaseController#authenticate sends such a caller to
    # Platform::Config.login_url instead of answering.
    #
    # The key used to be spelled allow_public here while Platform::Config.enable_public_api?
    # read public_enabled -- both written in the same commit, so the setting has never had a
    # reader and the predicate has always been nil.  Renamed to the spelling the code uses, and
    # shipped off rather than on: nil was already off everywhere, and this switch decides whether
    # every API controller in the host application answers callers it cannot identify.  Turning
    # it on is a decision to make deliberately.
    public_enabled:           false
    # Cross-origin browser calls.  On means the API answers a CORS preflight and sends
    # Access-Control-Allow-Origin: * with every response, so a page on any origin can call it
    # with a token of its own.  A viewer's session cookie is *not* sent to a wildcard origin, so
    # turning this on does not expose a signed-in viewer to a third-party page.
    #
    # Off, and shipped off, because it has never been on: #cors_preflight_check compared
    # request.method with :options -- a String against a Symbol -- so the preflight never fired,
    # and #cors_set_access_control_headers had no caller, so no response carried the headers
    # either.  Both are fixed; whether to use them is the host's decision.
    cors_enabled:             false
    cookies_enabled:          true
    max_models:               50
    request_limit:            3
    request_window:           1
    token_lifetime:           86400
    supported_versions:       ['1.0.0', '2.0.0']
    user:
      create_enabled:         true


#############################################################################
# Environment Settings
# You can overload any feature defined in the defaults for any environment
#############################################################################
development:
  <<: *defaults

test:
  <<: *defaults

qa:
  <<: *defaults

stage:
  <<: *defaults

production:
  <<: *defaults
